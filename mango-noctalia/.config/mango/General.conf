# Border Settings

border_radius=6
no_radius_when_single=0
no_border_when_single=1

# Overview Setting

enable_hotarea=0
hotarea_size=10
# ov_tab_mode=0
# ov_no_resize=1
overview_gap_inner=5
overview_gap_outer=30

# Keyboard related

repeat_rate=25
repeat_delay=300
numlock_on=0
xkb_rules_layout=latam,us
bind=SUPER,F11,switch_keyboard_layout
axis_bind_apply_timeout=100

# Trackpad
# need relogin to make it apply

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_speed=2.5

# Focus & Input

focused_opacity=1.0
unfocused_opacity=1.0
focus_on_activate=1
drag_tile_to_tile=1
drag_tile_small=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
focus_cross_monitor=0
focus_cross_tag=0

# Theming

cursor_size=24
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2.5






