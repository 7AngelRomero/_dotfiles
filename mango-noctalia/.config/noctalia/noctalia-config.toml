type = "aristides/udiskie:status"

[widget.taskbar]
enabled = false
type = "taskbar"

[widget.temp]
scale = 1.05
stat = "cpu_temp"
type = "sysmon"
visualization = "none"
show_value = true

[widget.tray]
capsule = true
capsule_padding = 15
detached_panel = true
drawer = true
drawer_item_size = 19.0
match_adjacent_spacing = true
scale = 1.1500000000000001
type = "tray"

[widget.volume]
scale = 1.1000000000000001
show_label = false
type = "volume"

[widget.weather]
capsule = true
capsule_opacity = 0.45000000000000001
capsule_padding = 10
capsule_radius = 10
type = "weather"

[widget.widget]
enabled = false
type = "oldirtty/color_picker:widget"

[widget.workspaces]
labels_only_when_occupied = true
type = "workspaces"
